# Deploys the palserver agent itself as a container.
# NOTE: PALSERVER_DATA_DIR uses Docker Desktop's daemon-visible Windows path.
# It must match the mount destination because instance config/save dirs are
# bind-mounted into sibling containers via docker.sock.
services:
  agent:
    build:
      context: .
      dockerfile: packages/agent/Dockerfile
    image: palserver/agent:latest
    restart: unless-stopped
    ports:
      - "8250:8250"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PALSERVER_DATA_DIR: /run/desktop/mnt/host/c/docker/palserver-agent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - C:/docker/palserver-agent:/run/desktop/mnt/host/c/docker/palserver-agent

  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    restart: unless-stopped
    network_mode: host
    environment:
      - SECRET_KEY=${PLAYIT_SECRET_KEY}
